name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../walk-coach.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 運動教練 Android App
          body: |
            第 ${{ github.run_number }} 版。用手機開啟下面的 walk-coach.apk 下載並安裝。
            直接下載：https://github.com/chahan1/walk/releases/download/android-latest/walk-coach.apk
          files: walk-coach.apk
          make_latest: true
      - name: Upload build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-log
          name: Android build log
          prerelease: true
          files: build.log
