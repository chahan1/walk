plugins { id 'com.android.application' }

def buildNum = (System.getenv('BUILD_NUM') ?: '1').toInteger()

android {
    namespace 'tw.chahan.walkcoach'
    compileSdk 34
    defaultConfig {
        applicationId 'tw.chahan.walkcoach'
        minSdk 26
        targetSdk 34
        versionCode buildNum
        versionName "0.1." + buildNum
    }
    signingConfigs {
        release {
            storeFile file('walkcoach.jks')
            storePassword 'walkcoach'
            keyAlias 'walkcoach'
            keyPassword 'walkcoach'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
